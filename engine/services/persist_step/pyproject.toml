[project]
name = "persist-step"
version = "0.1.0"
description = "Writer Engine step service: persist"
requires-python = ">=3.12"
dependencies = [
    "writer-engine",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persist_step"]

[tool.uv.sources]
writer-engine = { workspace = true }

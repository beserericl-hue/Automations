name: Writers Workbench CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'writers-workbench/**'
      - 'workflows/**'
      - 'scripts/check-base-table-immutability.py'
      - 'scripts/test-check-base-table-immutability.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'writers-workbench/**'
      - 'workflows/**'
      - 'scripts/check-base-table-immutability.py'
      - 'scripts/test-check-base-table-immutability.sh'
      - '.github/workflows/ci.yml'

defaults:
  run:
    working-directory: writers-workbench

jobs:
  schema-governance:
    name: Schema Governance Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run base-table immutability check
        run: python3 scripts/check-base-table-immutability.py
      - name: Run check-script unit tests
        run: bash scripts/test-check-base-table-immutability.sh

  lint-and-typecheck:
    name: TypeScript & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: writers-workbench/package-lock.json
      - run: npm ci
      - run: npx tsc -p client/tsconfig.json --noEmit
      - run: npx tsc -p server/tsconfig.json --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: writers-workbench/package-lock.json
      - run: npm ci
      - run: npm run test

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: writers-workbench/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-key
          VITE_N8N_WEBHOOK_URL: https://placeholder.example.com/webhook
          VITE_ELEVENLABS_AGENT_ID: placeholder-agent-id

  e2e-tests:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    # Job-level so the authenticated step's `if:` can see them: a step's own `env:` is not in scope
    # for its `if:`, which is why that step's old `env.E2E_TEST_EMAIL != ''` guard was always false
    # and the authenticated suite never ran in CI.
    env:
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_DEV_SUPABASE_URL: ${{ secrets.E2E_DEV_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: writers-workbench/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_N8N_WEBHOOK_URL: ${{ secrets.VITE_N8N_WEBHOOK_URL }}
          VITE_ELEVENLABS_AGENT_ID: ${{ secrets.VITE_ELEVENLABS_AGENT_ID }}
      - run: npx playwright test --project=chromium-noauth
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_N8N_WEBHOOK_URL: ${{ secrets.VITE_N8N_WEBHOOK_URL }}
          VITE_ELEVENLABS_AGENT_ID: ${{ secrets.VITE_ELEVENLABS_AGENT_ID }}
      # The authenticated suite, against the DEV deployment it was written for: it seeds and deletes
      # its own data there and mints its session with the service key (login is passwordless, so
      # there is no test password). Light pass only (Pass A); the engine-heavy Pass B runs by hand.
      # Runs only when the DEV secrets exist, and refuses anything that is not DEV.
      - name: Authenticated E2E against DEV (light pass)
        if: env.E2E_TEST_EMAIL != '' && contains(env.E2E_DEV_SUPABASE_URL, 'gvbvwcnmjkdpclcisqrr')
        env:
          CI: true
          E2E_BASE_URL: https://writersworkbench-develop.up.railway.app
          E2E_PASSES: A
          E2E_RETRIES: 1
          SUPABASE_URL: ${{ secrets.E2E_DEV_SUPABASE_URL }}
          E2E_SUPA_URL: ${{ secrets.E2E_DEV_SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.E2E_DEV_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_DEV_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_DEV_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_SUPA_SERVICE_KEY: ${{ secrets.E2E_DEV_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER_ID: '+14105914612'
        run: |
          npx playwright test --project=chromium-noauth --reporter=line
          bash e2e/run-regression.sh
      - name: Authenticated E2E skipped
        if: env.E2E_TEST_EMAIL == '' || !contains(env.E2E_DEV_SUPABASE_URL, 'gvbvwcnmjkdpclcisqrr')
        run: echo "::notice::Authenticated E2E not run - set E2E_TEST_EMAIL and the E2E_DEV_SUPABASE_* secrets (DEV only) to enable it."
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: writers-workbench/playwright-report/
          retention-days: 7

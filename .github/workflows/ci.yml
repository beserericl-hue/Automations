name: Writers Workbench CI

# No `paths:` filter here. `main` requires TypeScript & Lint, Unit Tests, Production Build and Schema
# Governance Check; a workflow skipped by a path filter never reports them, so a PR that touches none of
# the filtered paths (docs, wiki, .github) could never merge. Instead the workflow always runs, and the
# `changes` job decides whether the Workbench jobs have anything to do. A job skipped by its `if:`
# reports as successful, which satisfies the required check at the cost of a few seconds.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# PR runs supersede each other. Pushes get a unique group (run id), so every push to develop/main runs
# to completion: a shared group would cancel a queued push run whenever another push lands behind it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: writers-workbench

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      workbench: ${{ steps.filter.outputs.workbench }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # The paths the old `paths:` filter listed: anything here changing runs the full CI.
          filters: |
            workbench:
              - 'writers-workbench/**'
              - 'workflows/**'
              - 'scripts/check-base-table-immutability.py'
              - 'scripts/test-check-base-table-immutability.sh'
              - '.github/workflows/ci.yml'

  # Schema governance is seconds of Python, so it always runs: a required check with nothing to skip.
  schema-governance:
    name: Schema Governance Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run base-table immutability check
        run: python3 scripts/check-base-table-immutability.py
      - name: Run check-script unit tests
        run: bash scripts/test-check-base-table-immutability.sh

  lint-and-typecheck:
    name: TypeScript & Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workbench == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: writers-workbench/package-lock.json
      - run: npm ci
      - run: npx tsc -p client/tsconfig.json --noEmit
      - run: npx tsc -p server/tsconfig.json --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workbench == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: writers-workbench/package-lock.json
      - run: npm ci
      - run: npm run test

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [changes, lint-and-typecheck, unit-tests]
    if: needs.changes.outputs.workbench == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: writers-workbench/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-key
          VITE_N8N_WEBHOOK_URL: https://placeholder.example.com/webhook
          VITE_ELEVENLABS_AGENT_ID: placeholder-agent-id

  # E2E runs against the DEV deployment, never against a copy of the app built here, and with no
  # credentials: nothing secret is kept in GitHub. This job runs the specs that need no key (login
  # screen, route guards, public book-page 404) once DEV is serving this commit. The specs that need
  # DEV's database keys run on Railway, in the writer-e2e service (e2e/runner/), which reads its keys
  # from Railway and emails the result.
  e2e-dev:
    name: E2E against DEV (no credentials)
    # Pinned, not ubuntu-latest: GitHub moved latest to Ubuntu 26.04, which Playwright cannot install
    # chromium on ("does not support chromium on ubuntu26.04-x64"). Move this when Playwright supports it.
    runs-on: ubuntu-24.04
    needs: [changes, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.changes.outputs.workbench == 'true'
    env:
      E2E_BASE_URL: https://writersworkbench-develop.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the wait step checks whether DEV's commit contains this one
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: writers-workbench/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for DEV to serve this commit
        id: wait
        # When merges land back to back, DEV deploys only the newest commit and never serves this one.
        # If DEV serves a later commit that CONTAINS this one, this run is superseded: that commit's own
        # run tests DEV. Skip the specs here instead of failing after 30 minutes.
        run: |
          for i in $(seq 1 120); do
            v=$(curl -s -m 10 "$E2E_BASE_URL/api/health" | jq -r '.version // empty')
            if [ "$v" = "$GITHUB_SHA" ]; then echo "DEV is serving $GITHUB_SHA"; exit 0; fi
            if [ -n "$v" ] && git fetch -q origin develop && git merge-base --is-ancestor "$GITHUB_SHA" "$v" 2>/dev/null; then
              echo "::notice::Superseded: DEV is serving $v, which contains $GITHUB_SHA; its own run tests DEV."
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "::error::DEV did not serve $GITHUB_SHA within 30 minutes (serving: ${v:-unknown})"
          exit 1
      - run: npx playwright test --project=chromium-noauth --reporter=line
        if: steps.wait.outputs.superseded != 'true'
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: writers-workbench/playwright-report/
          retention-days: 7

name: Uptime

# External uptime check, from outside Railway: Railway cannot alert on its own outage (the 2026-05-19
# PROD Redis death went unnoticed for 9 days). Every 10 minutes this hits the public health URLs in
# .github/uptime-targets.txt (the single list; PROD URLs are added there at cutover). No secrets, no
# auth. A failed run makes GitHub email the owner of the workflow.
#
# Anti-flap: a target is only DOWN after 4 failed attempts over roughly 3-5 minutes (60 s timeout each,
# 30 s apart). That also covers a cold start: the DEV Workbench has Railway app sleeping on, and a
# sleeping service is woken by the first request, which can take tens of seconds to answer.
#
# GitHub runs `schedule` only from the default branch (main), so the cron starts at the next release.
# It also runs on any PR or develop push that changes the check, and by hand (workflow_dispatch, once
# the file is on main).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/uptime.yml', '.github/uptime-targets.txt']
  push:
    branches: [develop]
    paths: ['.github/workflows/uptime.yml', '.github/uptime-targets.txt']

permissions:
  contents: read

concurrency:
  group: uptime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Health URLs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/uptime-targets.txt
          sparse-checkout-cone-mode: false

      - name: Check every target
        env:
          ATTEMPTS: 4
          TIMEOUT: 60
          PAUSE: 30
        run: |
          set -uo pipefail
          down=0
          echo "| Target | Result | Attempts | Last HTTP | Time |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          while read -r name url; do
            case "$name" in ''|'#'*) continue ;; esac
            ok=0; code=000; t=0
            for i in $(seq 1 "$ATTEMPTS"); do
              out=$(curl -s -o body.txt -m "$TIMEOUT" -w '%{http_code} %{time_total}' "$url") || true
              code=${out%% *}; t=${out##* }
              # 2xx AND a health body: the Workbench answers unknown paths with its SPA page (200), so
              # a status code alone would pass even if the health route were gone.
              case "$code" in 2??) grep -Eq '"status" *: *"ok"' body.txt && { ok=1; break; } ;; esac
              echo "$name attempt $i/$ATTEMPTS: HTTP $code after ${t}s: $(head -c 160 body.txt 2>/dev/null | tr -s "\n\r\t " " ")"
              [ "$i" -lt "$ATTEMPTS" ] && sleep "$PAUSE"
            done
            if [ "$ok" = 1 ]; then
              echo "UP   $name HTTP $code in ${t}s (attempt $i) $url"
              echo "| $name | up | $i | $code | ${t}s |" >> "$GITHUB_STEP_SUMMARY"
            else
              down=$((down + 1))
              echo "::error title=$name is DOWN::$url did not answer a healthy 2xx (status ok) in $ATTEMPTS attempts (${TIMEOUT}s timeout, ${PAUSE}s apart); last HTTP $code (000 = no response)."
              echo "| $name | **DOWN** | $ATTEMPTS | $code | ${t}s |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < .github/uptime-targets.txt
          if [ "$down" -gt 0 ]; then
            echo "::error::$down target(s) down. See the job summary; URLs are in .github/uptime-targets.txt."
            exit 1
          fi
          echo "All targets up."

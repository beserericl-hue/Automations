# Railway config-as-code for the writer-engine-GATEWAY service.
#
# Point the writer-engine-gateway service at this file:
#   Railway → writer-engine-gateway → Settings → Config-as-code → Path = railway.gateway.toml
#   (Root Directory must be /writers-workbench/engine so paths below resolve.)
#
# See railway.runtime.toml for why each service has its own file rather than a shared
# railway.toml (the shared file forced the gateway Dockerfile onto the runtime and
# caused the 2026-05-31 outage).

[build]
builder = "DOCKERFILE"
dockerfilePath = "services/gateway/Dockerfile"

# B2: see railway.runtime.toml. The gateway's /admin/health is liveness only (it is a stateless
# proxy); its orchestrator dependency lives in /admin/ready so an orchestrator restart does not
# bounce the gateway in sympathy.
[deploy]
healthcheckPath = "/admin/health"
healthcheckTimeout = 30
restartPolicyType = "ALWAYS"

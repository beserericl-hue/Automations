[project]
name = "writer-engine"
version = "0.1.0"
description = "Writer Engine — the salable Python library that step services and orchestrators import"
requires-python = ">=3.12"
authors = [{ name = "Writer Engine contributors" }]
readme = "README.md"

dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "redis>=5.0.0",
    "arq>=0.26.0",
    "anthropic>=0.39.0",
    "google-genai>=1.0.0",
    "supabase>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "tenacity>=8.5.0",
    # A3: required by writer_engine.embeddings. Imported lazily so the module loads without it, but
    # ENABLE_PYTHON_EMBEDDINGS=true is useless unless it is installed — retrieval silently degrades
    # to no grounding, which is the exact silent-no-op class A1 exists to prevent.
    "openai>=1.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/writer_engine"]

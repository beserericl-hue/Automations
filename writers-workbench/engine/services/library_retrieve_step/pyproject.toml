[project]
name = "library-retrieve-step"
version = "0.1.0"
description = "F0-8 vertical-slice step service — reads content_ingestion_v2 (or in-memory) and returns items"
requires-python = ">=3.12"
dependencies = [
    "writer-engine",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/library_retrieve_step"]

[tool.uv.sources]
writer-engine = { workspace = true }

[project]
name = "gateway"
version = "0.1.0"
description = "Writer Engine API gateway — /internal (X-Service-Secret) + /v1 (API-key) + /admin + SSE relay"
requires-python = ">=3.12"
dependencies = [
    "writer-engine",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.uv.sources]
writer-engine = { workspace = true }

[project]
name = "orchestrator"
version = "0.1.0"
description = "Writer Engine orchestrator — saga coordinator + arq worker for long-running pipelines"
requires-python = ">=3.12"
dependencies = [
    "writer-engine",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.uv.sources]
writer-engine = { workspace = true }

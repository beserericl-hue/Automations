[project]
name = "steps-app"
version = "0.1.0"
description = "Writer Engine: single-process aggregator mounting every step service (B10)"
requires-python = ">=3.12"
dependencies = [
    "writer-engine",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "approval-step",
    "assemble-step",
    "brainstorm-step",
    "chapter-step",
    "deliver-step",
    "gather-step",
    "image-step",
    "library-retrieve-step",
    "library-step",
    "media-step",
    "notify-step",
    "persist-step",
    "pick-step",
    "render-step",
    "research-step",
    "scrape-step",
    "segment-step",
    "story-bible-step",
    "subject-step",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steps_app"]

[tool.uv.sources]
writer-engine = { workspace = true }
approval-step = { workspace = true }
assemble-step = { workspace = true }
brainstorm-step = { workspace = true }
chapter-step = { workspace = true }
deliver-step = { workspace = true }
gather-step = { workspace = true }
image-step = { workspace = true }
library-retrieve-step = { workspace = true }
library-step = { workspace = true }
media-step = { workspace = true }
notify-step = { workspace = true }
persist-step = { workspace = true }
pick-step = { workspace = true }
render-step = { workspace = true }
research-step = { workspace = true }
scrape-step = { workspace = true }
segment-step = { workspace = true }
story-bible-step = { workspace = true }
subject-step = { workspace = true }
